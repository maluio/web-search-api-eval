[project]
name = "evalkit"
version = "0.1.0"
description = "Eval of web search / web fetch APIs via OpenRouter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
capabilities = "evalkit.capabilities:main"
eval-run = "evalkit.run:main"
eval-judge = "evalkit.judge:main"
eval-report = "evalkit.report:main"
add-query = "evalkit.add_query:main"
publish = "evalkit.publish:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
